tips:
  t049: "hermes -w 创建一个隔离的 git worktree——非常适合并行运行的多个智能体。"
  t072: "hermes mcp serve 把 Hermes 本身作为 MCP 服务器运行，供其他代理使用。"
  t098: "设置 browser.record_sessions: true，自动把浏览器会话录制为 WebM 视频。"
  t114: "read_file 自动去重——重新读取未更改的文件只会返回一段简短说明，不再重复内容。"
  t115: "browser_vision 截取屏幕截图并用 AI 分析——对验证码和视觉内容同样有效。"
  t116: "browser_console 可在页面上下文中执行 JavaScript 表达式。"
  t138: "代理有两个记忆存储：个人笔记（约 2200 字符）和用户档案（约 1375 字符）。"
  t180: "五种浏览器提供方：本地 Chromium、Browserbase、Browser Use、Camofox 和 Firecrawl。"
  t181: "Camofox 是一款反检测浏览器——基于 Firefox 分支，采用 C++ 指纹伪装。"
  t182: "browser_navigate 会自动返回页面快照——无需再调用 browser_snapshot。"
  t183: "browser_vision 配合 annotate=true 会在可交互元素上叠加编号标签。"
  t198: "插件有三种类型：通用插件（工具与扩展点）、记忆提供方和上下文引擎。"
  t201: "插件扩展点包括 pre/post_tool_call、pre/post_llm_call，以及用于规范化输出的 transform_terminal_output。"
  t221: "/compress <focus topic> 会把 60-70% 的摘要篇幅分配给你指定的主题，并大幅精简其余内容。"
  t224: "在 config.yaml 中设置 network.force_ipv4: true 可修复 IPv6 损坏的服务器上的无响应问题——通过给 socket 打补丁实现。"
  t262: "超过 15,000 字符的浏览器页面快照会被截断或自动摘要；完整快照保存在 cache/web 下，可用 read_file 分页读取。"
  t263: "压缩器会先做一次低成本预处理：在大模型运行之前，超过 200 字符的工具输出会被替换为简短标记。"
  t275: "hermes claw migrate --dry-run 预览 OpenClaw 迁移结果，不会写入任何内容。"
  t281: "配置中的 MCP ${ENV_VAR} 变量引用会在服务器启动时替换为实际值——包括来自 ~/.hermes/.env 的变量。"
  t300: "网关事件回调位于 ~/.hermes/hooks/<name>/，包含 HOOK.yaml 和 handler.py——处理函数必须命名为 `handle`。"
  t301: "可订阅的事件包括 gateway:startup、session:start、agent:step，以及 command:* 通配订阅。"
  t302: "放一份 ~/.hermes/BOOT.md 清单，再订阅 gateway:startup 事件，每次启动都会以一次性代理执行它。"
  t324: "HERMES_ACCEPT_HOOKS 自动批准 config.yaml 中声明的、此前未见过的 shell 回调脚本，无需在终端确认。"
  t328: "tts.providers.<name>.type: command 可接入任何命令行 TTS 引擎，使用 {input_path} 和 {output_path} 两个变量。"
  t360: "HERMES_ENABLE_PROJECT_PLUGINS=1 自动加载 ./.hermes/plugins/ 下的仓库本地插件——设计上有信任校验。"
