tips:
  t072: "hermes mcp serve 會將 Hermes 本身作為 MCP 伺服器執行，供其他代理使用。"
  t098: "設定 browser.record_sessions: true 可自動將瀏覽器工作階段錄製為 WebM 影片。"
  t115: "browser_vision 會擷取螢幕截圖並用 AI 分析 — 適用於 CAPTCHA 與視覺內容。"
  t116: "browser_console 可在頁面上下文中評估 JavaScript 表達式。"
  t180: "五種瀏覽器提供方：本機 Chromium、Browserbase、Browser Use、Camofox 與 Firecrawl。"
  t181: "Camofox 是反偵測瀏覽器 — 以 Firefox 分支為基礎，用 C++ 偽裝指紋。"
  t182: "browser_navigate 會自動回傳頁面快照 — 之後不必再呼叫 browser_snapshot。"
  t183: "browser_vision 搭配 annotate=true 會在互動元素上疊加編號標籤。"
  t221: "/compress <focus topic> 會把 60-70% 的摘要篇幅分配給你指定的主題，並大幅精簡其餘內容。"
  t262: "超過 15,000 字元的瀏覽器頁面快照會被截斷或自動摘要；完整快照會儲存到 cache/web，可用 read_file 分頁讀取。"
  t263: "壓縮器會先做一次低成本的預處理：超過 200 字元的工具輸出會在大模型執行前先替換為簡短標記。"
  t275: "hermes claw migrate --dry-run 可預覽 OpenClaw 遷移，而不會寫入任何內容。"
  t281: "設定中的 MCP ${ENV_VAR} 變數引用會在伺服器啟動時替換為實際值 — 包含來自 ~/.hermes/.env 的變數。"
  t328: "tts.providers.<name>.type: command 可透過 {input_path} 與 {output_path} 兩個變數接上任何 CLI TTS 引擎。"
